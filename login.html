<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuário</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Jua', 'Comic Neue', sans-serif;
        }

       
        .card-container {
            background-color: #d9d9d9; 
            border: 24px solid #4a9ec5; 
            border-radius: 36px;
            width: 580px;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        
        .header-section {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
        }

       
        .user-icon-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        
        .form-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .title-box-login {
            background-color: #1e3d4a; 
            color: #000000; 
            font-size: 26px;
            width: 250px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .input-field {
            background-color: #056b93; 
            color: #000000; 
            border: none;
            outline: none;
            width: 250px;
            height: 42px;
            border-radius: 12px;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            font-size: 20px;
            text-align: center;
        }

        .input-field::placeholder {
            color: #000000;
            opacity: 1;
        }

        .enter-btn {
            background-color: #1e3d4a; 
            color: #000000; 
            border: none;
            width: 250px;
            height: 42px;
            border-radius: 12px;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <div class="header-section">
            <img class="user-icon-img" src="img/download.png" alt="Ícone de Usuário">
        </div>

        <div class="form-section">
            <div class="title-box-login">login</div>
            
            <input type="text" class="input-field" placeholder="Username">
            <input type="password" class="input-field" placeholder="Password">
            
            <button class="enter-btn">Enter</button>
        </div>

    </div>

</body>
</html>
