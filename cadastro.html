<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Usuário</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Jua', 'Comic Neue', sans-serif;
        }

        /* Container principal com a borda azul grossa */
        .card-container {
            background-color: #d9d9d9; /* Fundo cinza claro da imagem */
            border: 24px solid #4a9ec5; /* Borda azul grossa arredondada */
            border-radius: 36px;
            width: 580px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Topo: Ícone e Título */
        .header-section {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 35px;
            padding-left: 20px;
        }

        /* Ajuste para a imagem do ícone enviada */
        .user-icon-img {
            width: 110px;
            height: 110px;
            margin-right: 25px;
            object-fit: contain;
        }

        /* Caixa de Título "Cadastro do usuário" */
        .title-box {
            background-color: #1e3d4a; /* Azul escuro */
            color: #000000; /* Texto preto */
            font-size: 24px;
            padding: 10px 25px;
            border-radius: 14px;
            white-space: nowrap;
        }

        /* Formulário de Inputs */
        .form-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 45px;
        }

        /* Estilo das caixas de input azuladas */
        .input-field {
            background-color: #056b93; /* Azul médio dos inputs */
            color: #000000; /* Texto interno preto */
            border: none;
            outline: none;
            width: 250px;
            height: 42px;
            border-radius: 12px;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            font-size: 20px;
            text-align: center;
        }

        /* Placeholder com a cor preta idêntica */
        .input-field::placeholder {
            color: #000000;
            opacity: 1;
        }

        /* Botão "Register" */
        .register-btn {
            background-color: #1e3d4a; /* Azul escuro idêntico ao do título */
            color: #000000; /* Texto preto */
            border: none;
            width: 250px;
            height: 65px;
            border-radius: 16px;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <div class="header-section">
            <img class="user-icon-img" src="img/download.png" alt="Ícone de Usuário">
            
            <div class="title-box">Cadastro do usuário</div>
        </div>

        <div class="form-section">
            <input type="text" class="input-field" placeholder="login">
            <input type="password" class="input-field" placeholder="Password">
            <input type="text" class="input-field" placeholder="Username">
            <input type="email" class="input-field" placeholder="Email">
        </div>

        <button class="register-btn">Register</button>

    </div>

</body>
</html>
